<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Lista produktów</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Produkty</h1>
  <a href="create.html"><button>Dodaj produkt</button></a>
  <a href="logout.php"><button>Wyloguj</button></a>

  <table border="1" id="products-table">
    <thead>
      <tr>
        <th class="id-col">ID</th> 
        <th>#</th> 
        <th>Nazwa</th>
        <th>Cena</th>
        <th>Opis</th>
        <th>Akcje</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

 
  <h2>Pogoda</h2>
  <input id="city" placeholder="Wpisz miasto (np. Warsaw)">
  <button onclick="getWeather()">Pokaż pogodę</button>
  <div id="weather"></div>

  <script>
    
    function loadProducts() {
      fetch('api/index.php')
        .then(res => res.json())
        .then(products => {
          const tbody = document.querySelector('#products-table tbody');
          tbody.innerHTML = products.map((p, index) => `
            <tr>
              <td class="id-col">${p.id}</td> <!-- скрытый id для JS -->
              <td>${index + 1}</td> <!-- порядковый номер -->
              <td>${p.name}</td>
              <td>${p.price} zł</td>
              <td>${p.description}</td>
              <td>
                <a href="update.html?id=${p.id}">✏️</a>
                <a href="#" onclick="deleteProduct(${p.id}); return false;">🗑️</a>
              </td>
            </tr>
          `).join('');
        })
        .catch(err => console.error(err));
    }

    function deleteProduct(id) {
      if (!confirm('Czy na pewno chcesz usunąć produkt?')) return;

      fetch(`api/delete.php?id=${id}`)
        .then(res => res.text())
        .then(() => loadProducts())
        .catch(err => console.error(err));
    }

    loadProducts();

    fetch('api/index.php')
      .then(res => {
        if(res.status === 401){
          window.location.href = 'login.php';
        }
      });

    // --- Функция погоды ---
    async function getWeather() {
        const city = document.getElementById('city').value;
        const resultDiv = document.getElementById('weather');
        resultDiv.innerHTML = 'Ładowanie...';

        try {
            const res = await fetch(`api/weather.php?city=${city}`);
            if (!res.ok) throw new Error('Błąd ' + res.status);
            const data = await res.json();
            resultDiv.innerHTML = `Aktualnie: ${data.temperature_now}°C<br>Prognoza: ${data.forecast.join(", ")}`;
        } catch (err) {
            resultDiv.innerHTML = 'Błąd: ' + err.message;
        }
    }
  </script>

</body>
</html>

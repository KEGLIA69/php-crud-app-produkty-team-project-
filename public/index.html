<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Lista produktów</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Produkty</h1>
  <a href="create.html"><button>Dodaj produkt</button></a>

  <table border="1" id="products-table">
    <thead>
      <tr>
        <th class="id-col">ID</th> <!-- скрытый -->
        <th>#</th> <!-- порядковый номер -->
        <th>Nazwa</th>
        <th>Cena</th>
        <th>Opis</th>
        <th>Akcje</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function loadProducts() {
      fetch('api/index.php')
        .then(res => res.json())
        .then(products => {
          const tbody = document.querySelector('#products-table tbody');
          tbody.innerHTML = products.map((p, index) => `
            <tr>
              <td class="id-col">${p.id}</td> <!-- скрытый id для JS -->
              <td>${index + 1}</td> <!-- порядковый номер -->
              <td>${p.name}</td>
              <td>${p.price} zł</td>
              <td>${p.description}</td>
              <td>
                <a href="update.html?id=${p.id}">✏️</a>
                <a href="#" onclick="deleteProduct(${p.id}); return false;">🗑️</a>
              </td>
            </tr>
          `).join('');
        })
        .catch(err => console.error(err));
    }

    function deleteProduct(id) {
      if (!confirm('Czy na pewno chcesz usunąć produkt?')) return;

      fetch(`api/delete.php?id=${id}`)
        .then(res => res.text())
        .then(() => loadProducts())
        .catch(err => console.error(err));
    }

    // Загрузка продуктов при открытии страницы
    loadProducts();
  </script>
</body>
</html>

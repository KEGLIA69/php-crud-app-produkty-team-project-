<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Edytuj produkt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Edytuj produkt</h1>
  <form id="updateForm">
    <input type="text" name="name" placeholder="Nazwa" required><br>
    <input type="number" name="price" placeholder="Cena" required><br>
    <textarea name="description" placeholder="Opis"></textarea><br>
    <button type="submit">Zaktualizuj</button>
  </form>

  <script>
    // получаем id из URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const form = document.getElementById('updateForm');

    // при сабмите формы отправляем fetch к update.php
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const data = new FormData(form);

      fetch(`api/update.php?id=${id}`, {
        method: 'POST',
        body: data
      })
        .then(res => res.text())
        .then(() => {
          alert('Produkt zaktualizowany!');
          window.location.href = 'index.html';
        })
        .catch(err => console.error(err));
    });

    // Опционально: можно загрузить данные продукта через API и подставить в форму
    fetch(`api/index.php`)
      .then(res => res.json())
      .then(products => {
        const product = products.find(p => p.id == id);
        if (product) {
          form.name.value = product.name;
          form.price.value = product.price;
          form.description.value = product.description;
        }
      });
  </script>
</body>
</html>
